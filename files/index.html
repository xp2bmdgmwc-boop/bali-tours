<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Валерий Латыпов — Авторские пути на Бали</title>
<meta name="description" content="Авторские индивидуальные пути на Бали с Валерием Латыповым. Огонь Духа — для мужчин. Мягкая Сила — для женщин.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --serif:"PT Serif",Georgia,serif;
  --sans:"Manrope",-apple-system,sans-serif;
  --yang:#C9501E;
  --yang-h:#A8401A;
  --yin:#2C4A35;
  --yin-h:#1E3325;
}
html,body{height:100%;overflow:hidden;}
body{
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  cursor:default;
}
@media(max-width:700px){
  html,body{overflow:auto;}
}

/* LANG TOGGLE */
.lang{
  position:fixed;top:28px;left:50%;transform:translateX(-50%);
  z-index:200;
  display:flex;align-items:center;gap:8px;
  font-family:var(--sans);font-size:11px;font-weight:500;
  letter-spacing:0.2em;text-transform:uppercase;
}
.lang-btn{
  padding:7px 14px;
  background:rgba(250,250,247,0.12);
  border:1px solid rgba(250,250,247,0.2);
  color:rgba(250,250,247,0.5);
  cursor:pointer;transition:all 0.2s;
  font-family:var(--sans);font-size:11px;font-weight:500;
  letter-spacing:0.18em;text-transform:uppercase;
}
.lang-btn.active{
  background:rgba(250,250,247,0.18);
  border-color:rgba(250,250,247,0.5);
  color:#FAFAF7;
}

/* LOGO */
.logo{
  position:fixed;top:28px;left:clamp(20px,4vw,52px);
  z-index:200;
  font-family:var(--serif);font-size:16px;
  color:rgba(250,250,247,0.6);letter-spacing:0.08em;
}
.logo span{color:var(--yang);}

/* SPLIT */
.split{
  display:flex;height:100vh;
  position:relative;
}
@media(max-width:700px){
  .split{flex-direction:column;height:auto;min-height:100vh;}
}

.panel{
  flex:1;position:relative;overflow:hidden;
  cursor:pointer;
  transition:flex 0.7s cubic-bezier(0.77,0,0.175,1);
}
.panel:hover{flex:1.35;}
@media(max-width:700px){
  .panel{flex:none;min-height:50vh;}
  .panel:hover{flex:none;}
}

.panel-bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  transition:transform 0.7s cubic-bezier(0.77,0,0.175,1),filter 0.5s;
  filter:brightness(0.45) saturate(0.8);
}
.panel:hover .panel-bg{
  transform:scale(1.04);
  filter:brightness(0.55) saturate(0.9);
}

/* Yang panel */
.panel-yang .panel-bg{
  background-image:
    linear-gradient(to right, rgba(10,8,6,0.5) 0%, rgba(10,8,6,0.1) 100%),
    url('https://static.tildacdn.com/tild3163-6135-4063-b239-323262636632/DSC00497.jpg');
}
/* Yin panel */
.panel-yin .panel-bg{
  background-image:
    linear-gradient(to left, rgba(6,10,8,0.5) 0%, rgba(6,10,8,0.1) 100%),
    url('https://static.tildacdn.com/tild3163-6135-4063-b239-323262636632/DSC00497.jpg');
  filter:brightness(0.4) saturate(0.7) hue-rotate(30deg);
}
.panel-yin:hover .panel-bg{
  filter:brightness(0.5) saturate(0.8) hue-rotate(20deg);
}

/* Vertical divider */
.divider-v{
  position:absolute;left:50%;top:0;bottom:0;
  width:1px;
  background:rgba(250,250,247,0.12);
  z-index:10;
  pointer-events:none;
  transition:opacity 0.4s;
}
@media(max-width:700px){display:none;}

.panel-content{
  position:relative;z-index:2;
  height:100%;
  display:flex;flex-direction:column;
  justify-content:center;
  padding:clamp(40px,6vw,80px) clamp(32px,5vw,72px);
}
@media(max-width:700px){
  .panel-content{
    justify-content:flex-end;
    padding:40px 28px 52px;
    min-height:50vh;
  }
}

.panel-for{
  font-size:10px;font-weight:500;letter-spacing:0.28em;
  text-transform:uppercase;
  margin-bottom:20px;
  opacity:0.45;color:#FAFAF7;
  transition:opacity 0.3s;
}
.panel:hover .panel-for{opacity:0.7;}

.panel-name{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(44px,6.5vw,96px);
  line-height:0.92;letter-spacing:-0.025em;
  color:#FAFAF7;
  margin-bottom:16px;
}
.panel-yang .panel-name em{
  display:block;font-style:italic;color:var(--yang);
}
.panel-yin .panel-name em{
  display:block;font-style:italic;
  color:#7AB090;
}

.panel-sub{
  font-size:clamp(13px,1.2vw,16px);
  color:rgba(250,250,247,0.5);
  line-height:1.6;
  max-width:320px;
  margin-bottom:36px;
  transition:color 0.3s;
}
.panel:hover .panel-sub{color:rgba(250,250,247,0.7);}

.panel-enter{
  display:inline-flex;align-items:center;gap:10px;
  font-size:11px;font-weight:600;letter-spacing:0.2em;
  text-transform:uppercase;
  padding:13px 24px;
  border:1px solid rgba(250,250,247,0.2);
  color:rgba(250,250,247,0.5);
  transition:all 0.3s;
  opacity:0;transform:translateY(8px);
}
.panel:hover .panel-enter{
  opacity:1;transform:translateY(0);
  border-color:rgba(250,250,247,0.5);
  color:#FAFAF7;
}
.panel-yang:hover .panel-enter{
  background:var(--yang);
  border-color:var(--yang);
}
.panel-yin:hover .panel-enter{
  background:var(--yin);
  border-color:var(--yin);
}

.panel-specs{
  position:absolute;bottom:clamp(24px,3vw,40px);
  left:clamp(32px,5vw,72px);
  display:flex;gap:28px;
  opacity:0;transition:opacity 0.35s 0.1s;
}
.panel:hover .panel-specs{opacity:1;}
.panel-spec{display:flex;flex-direction:column;gap:3px;}
.panel-spec-val{
  font-family:var(--serif);font-size:18px;font-weight:700;
  color:#FAFAF7;
}
.panel-yang .panel-spec-val{color:var(--yang);}
.panel-yin .panel-spec-val{color:#7AB090;}
.panel-spec-label{
  font-size:10px;letter-spacing:0.18em;text-transform:uppercase;
  color:rgba(250,250,247,0.35);font-weight:500;
}

/* Center line text */
.center-badge{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  z-index:20;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:opacity 0.4s;
}
.center-badge-circle{
  width:56px;height:56px;border-radius:50%;
  border:1px solid rgba(250,250,247,0.2);
  display:flex;align-items:center;justify-content:center;
  background:rgba(14,14,12,0.4);
  backdrop-filter:blur(8px);
}
.center-badge-v{
  font-family:var(--serif);font-size:18px;color:rgba(250,250,247,0.6);
}
.split:has(.panel:hover) .center-badge{opacity:0;}
@media(max-width:700px){.center-badge{display:none;}}
</style>
</head>
<body>

<div class="logo">В <span>·</span> Л</div>

<div class="lang" id="langToggle">
  <button class="lang-btn active" onclick="setLang('ru')">RU</button>
  <button class="lang-btn" onclick="setLang('en')">EN</button>
</div>

<div class="split">

  <!-- YANG — MEN -->
  <div class="panel panel-yang" id="yangPanel" onclick="goYang()">
    <div class="panel-bg"></div>
    <div class="panel-content">
      <div class="panel-for" data-ru="Для мужчин" data-en="For Men">Для мужчин</div>
      <h1 class="panel-name">
        Огонь<br><em>Духа</em>
      </h1>
      <p class="panel-sub" data-ru="Закрытый авторский путь к местам силы Бали. Ритуалы, огонь, Крис." data-en="A private author's journey to Bali's places of power. Rituals, fire, Keris.">
        Закрытый авторский путь к местам силы Бали. Ритуалы, огонь, Крис.
      </p>
      <div class="panel-enter" data-ru="Войти в путь →" data-en="Enter the path →">Войти в путь →</div>
    </div>
    <div class="panel-specs">
      <div class="panel-spec">
        <span class="panel-spec-val">5</span>
        <span class="panel-spec-label">дней</span>
      </div>
      <div class="panel-spec">
        <span class="panel-spec-val">1:1</span>
        <span class="panel-spec-label">формат</span>
      </div>
      <div class="panel-spec">
        <span class="panel-spec-val">€7 400</span>
        <span class="panel-spec-label">от</span>
      </div>
    </div>
  </div>

  <!-- CENTER -->
  <div class="divider-v"></div>
  <div class="center-badge">
    <div class="center-badge-circle">
      <span class="center-badge-v">VL</span>
    </div>
  </div>

  <!-- YIN — WOMEN -->
  <div class="panel panel-yin" id="yinPanel" onclick="goYin()">
    <div class="panel-bg"></div>
    <div class="panel-content">
      <div class="panel-for" data-ru="Для женщин" data-en="For Women">Для женщин</div>
      <h1 class="panel-name">
        Мягкая<br><em>Сила</em>
      </h1>
      <p class="panel-sub" data-ru="Индивидуальный путь к женской силе через места силы острова Бали." data-en="An individual journey to feminine power through Bali's sacred island places.">
        Индивидуальный путь к женской силе через места силы острова Бали.
      </p>
      <div class="panel-enter" data-ru="Войти в путь →" data-en="Enter the path →">Войти в путь →</div>
    </div>
    <div class="panel-specs">
      <div class="panel-spec">
        <span class="panel-spec-val">5</span>
        <span class="panel-spec-label">дней</span>
      </div>
      <div class="panel-spec">
        <span class="panel-spec-val">1:1</span>
        <span class="panel-spec-label">формат</span>
      </div>
      <div class="panel-spec">
        <span class="panel-spec-val">€7 400</span>
        <span class="panel-spec-label">от</span>
      </div>
    </div>
  </div>

</div>

<script>
let lang = 'ru';

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.lang-btn')[l === 'ru' ? 0 : 1].classList.add('active');

  // Update yang panel
  if (l === 'en') {
    document.querySelector('.panel-yang .panel-name').innerHTML = 'Spirit<br><em>Fire</em>';
    document.querySelector('.panel-yin .panel-name').innerHTML = 'Soft<br><em>Power</em>';
    document.querySelector('#yangPanel .panel-specs .panel-spec-label').textContent = 'days';
  } else {
    document.querySelector('.panel-yang .panel-name').innerHTML = 'Огонь<br><em>Духа</em>';
    document.querySelector('.panel-yin .panel-name').innerHTML = 'Мягкая<br><em>Сила</em>';
  }

  document.querySelectorAll('[data-ru]').forEach(el => {
    el.textContent = l === 'ru' ? el.dataset.ru : el.dataset.en;
  });
}

function goYang() {
  window.location.href = lang === 'ru' ? 'yang.html' : 'yang-en.html';
}
function goYin() {
  window.location.href = lang === 'ru' ? 'yin.html' : 'yin-en.html';
}
</script>
</body>
</html>
